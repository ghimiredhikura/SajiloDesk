name: Deploy SajiloDesk to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL || 'https://ghimiredhikura.github.io' }}
      PUBLIC_BASE_PATH: ${{ vars.PUBLIC_BASE_PATH || '/SajiloDesk/' }}
      PUBLIC_INDEXABLE: ${{ vars.PUBLIC_INDEXABLE || 'false' }}
      PUBLIC_CONTACT_EMAIL: sajilodesk@gmail.com
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Verify, build and upload Pages artifact
        uses: withastro/action@v6
        with:
          node-version: 24
          build-cmd: npm run verify

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v5

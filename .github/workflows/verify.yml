name: Verify SajiloDesk

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PUBLIC_SITE_URL: https://sajilodesk.com
      PUBLIC_BASE_PATH: /
      PUBLIC_INDEXABLE: 'true'
      PUBLIC_CONTACT_EMAIL: sajilodesk@gmail.com
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify production build
        run: npm run verify
